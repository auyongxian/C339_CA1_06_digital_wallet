name: Digital Wallet Unit Tests

# Advanced feature: fewer, smarter test runs.
# 1. paths       - run only when a .py or .yml/.yaml file changes (README or other edits are ignored).
# 2. concurrency - a newer push to the same branch cancels the older run that is still in progress.

on:
  push:
    paths:
      - "**.py"
      - "**.yml"
      - "**.yaml"
  workflow_dispatch: # manual "Run workflow" button, useful for the live demo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: python -m pytest -v --cov=src --cov-report=term-missing